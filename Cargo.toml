[package]
name = "cc-tps"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.38"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
